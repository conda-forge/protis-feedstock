{% set name = "protis" %}
{% set version = "1.0.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://gitlab.com/{{ name }}/{{ name }}/-/archive/v{{ version }}/{{ name }}-v{{ version }}.tar.gz
  sha256: 38fe81e90d83c34376f7367cb0e83dc6b7703c48f82abec100465edd1c39062f

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  noarch: python

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=42
    - wheel
    - pip
  run:
    - python >={{ python_min }}
    - nannos >=2.6.4
    - scikit-image

test:
  imports:
    - protis
  source_files:
    - test/conda_test.py
  commands:
    - pytest -s -vv ./test/conda_test.py
  requires:
    - pytest
    - python {{ python_min }}


about:
  home: https://gitlab.com/protis/protis
  summary: Plane Wave Expansion method for photonic crystals
  license: GPL-3.0-or-later
  license_file: LICENSE.txt

extra:
  recipe-maintainers:
    - benvial
